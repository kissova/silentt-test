name: Build iOS Dylibb

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Install ldid
        run: |
          brew install ldid

      - name: Build dylib into visible output folder
        run: |
          mkdir -p output
          make clean
          make package FINALPACKAGE=1

          find .theos/obj -name "*.dylib" -exec cp -f {} output/ \;

          for dylib in output/*.dylib; do
            [ -e "$dylib" ] || continue
            install_name_tool -delete_rpath /Library/Frameworks "$dylib" 2>/dev/null || true
            install_name_tool -change /Library/Frameworks/CydiaSubstrate.framework/CydiaSubstrate @rpath/CydiaSubstrate.framework/CydiaSubstrate "$dylib" 2>/dev/null || true
            ldid -S "$dylib" || true
          done

          ls -la output/

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: silentt-dylib-output
          path: output/*.dylib
